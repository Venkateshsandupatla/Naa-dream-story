<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naa Dream ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #03130d;
    --bg2: #0e3d2b;
    --text: #f2fff7;
    --muted: #a9d9bf;
    --accent: #1fae63;
    --accent-soft: #c6f6d9;
    --card: rgba(255, 255, 255, 0.07);
    --border: rgba(198, 246, 217, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    background-color: var(--bg1);
    overflow: hidden;
    user-select: none;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .moon {
    position: fixed; top: 6vh; right: 8vw; width: 70px; height: 70px; border-radius: 50%;
    background: #f4ffe0; box-shadow: 0 0 40px 10px rgba(210, 255, 200, .3);
    z-index: 0;
  }
  .moon::after {
    content: ''; position: absolute; width: 70px; height: 70px; border-radius: 50%;
    background: var(--bg2); top: -10px; left: 18px; opacity: .92;
  }
  #confetti { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

  main {
    position: relative; z-index: 2; height: 100%;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .scene {
    display: none; width: 100%; max-width: 420px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    padding: 36px 22px 28px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .scene.active { display: block; animation: fadeUp .7s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }

  .emoji { font-size: 72px; line-height: 1; margin-bottom: 18px; display: inline-block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  h1 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 30px; margin-bottom: 12px; color: var(--accent-soft); }
  p { font-size: 19px; line-height: 1.55; color: var(--text); }
  p.small { font-size: 15px; color: var(--muted); margin-top: 10px; }

  .btn {
    font-family: inherit; font-weight: 700; font-size: 17px; border: none; cursor: pointer;
    border-radius: 999px; padding: 14px 28px; margin-top: 26px;
    background: var(--accent); color: #fff; box-shadow: 0 8px 24px rgba(31, 174, 99, .45);
    transition: transform .15s, background .2s;
  }
  a.btn.cal { display: inline-block; text-decoration: none; font-size: 16px; }
  .btn:active { transform: scale(.95); }

  .polaroids { display: flex; justify-content: center; gap: 6px; margin: -6px 0 18px; }
  .polaroid {
    background: #fdfdf8; padding: 7px 7px 22px; border-radius: 4px; width: 46%; max-width: 160px;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
  }
  .polaroid:nth-child(1) { transform: rotate(-6deg); }
  .polaroid:nth-child(2) { transform: rotate(5deg) translateY(8px); }
  .polaroid img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 2px; }

  .dots { margin-top: 18px; display: flex; gap: 6px; justify-content: center; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .dots span.on { background: var(--accent); }

  .answers { position: relative; height: 150px; margin-top: 10px; }
  #yesBtn {
    position: absolute; left: 50%; top: 20px; transform: translateX(-50%);
    margin: 0; z-index: 3; white-space: nowrap; transition: font-size .25s, padding .25s;
  }
  #noBtn {
    position: fixed; margin: 0; z-index: 4;
    background: #fff; color: #555; box-shadow: 0 6px 18px rgba(0,0,0,.25);
    transition: left .2s ease, top .2s ease;
  }
  #noMsg { min-height: 26px; font-size: 16px; color: var(--accent-soft); margin-top: 6px; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .opt {
    font-family: inherit; font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 16px; padding: 14px 8px;
  }
  .opt:last-child:nth-child(odd) { grid-column: span 2; }
  .opt.sel { background: var(--accent); border-color: var(--accent); }
  .label { margin-top: 22px; font-size: 15px; color: var(--muted); text-align: left; }
  .rules { list-style: none; text-align: left; margin: 6px auto 0; max-width: 300px; }
  .rules li {
    font-size: 17px; padding: 12px 14px; margin-top: 8px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1px solid var(--border);
  }
  .summary {
    margin-top: 18px; padding: 16px; border-radius: 16px; border: 1px dashed var(--accent);
    font-size: 18px; line-height: 1.7;
  }
</style>
</head>

const app = document.getElementById('app');
const noBtn = document.getElementById('noBtn');
const choice = { prize: null, day: null };

function dots(i, total) {
  return '<div class="dots">' + Array.from({ length: total }, (_, k) =>
    `<span class="${k <= i ? 'on' : ''}"></span>`).join('') + '</div>';
}

function show(html) {
  app.innerHTML = `<section class="scene active">${html}</section>`;
}

function intro() {
  show(`
    <div class="emoji">✨</div>
    <h1>Hii ${CONFIG.herName} 👋</h1>
    <p>You asked me what my dream was, right?</p>
    <p class="small">Kinda tap chey, naa dream lo ki velldam 💭</p>
    <button class="btn" onclick="storyScene(0)">Enter the dream 🌙</button>
  `);
}

function storyScene(i) {
  const s = CONFIG.story[i];
  const last = i === CONFIG.story.length - 1;
  show(`
    ${s.photos ? `<div class="polaroids">${s.photos.map(src => `<div class="polaroid"><img src="${src}" alt="Flower photo"></div>`).join('')}</div>`
               : `<div class="emoji">${s.emoji}</div>`}
    <p>${s.text}</p>
    <button class="btn" onclick="${last ? 'cliff()' : `storyScene(${i + 1})`}">${last ? 'Nenu em cheppanu?? 😳' : 'Next →'}</button>
    ${dots(i, CONFIG.story.length)}
  `);
}

function cliff() {
  show(`
    <div class="emoji">🤫</div>
    <p>${CONFIG.cliffhanger}</p>
    <button class="btn" onclick="ask()">Sare… 👀</button>
  `);
}

let noCount = 0;
function ask() {
  noCount = 0;
  show(`
    <div class="emoji">🤭</div>
    <h1>${CONFIG.questionTitle}</h1>
    <p>${CONFIG.question}</p>
    <div class="answers">
      <button class="btn" id="yesBtn" onclick="yes()">Yes 💚</button>
    </div>
    <div id="noMsg"></div>
  `);
  // wait for the card's slide-in animation to finish before placing No next to Yes
  app.querySelector('.scene').addEventListener('animationend', () => {
    const y = document.getElementById('yesBtn').getBoundingClientRect();
    noBtn.style.display = 'block';
    noBtn.style.left = Math.min(window.innerWidth - 90, y.right + 16) + 'px';
    noBtn.style.top = y.top + 'px';
  }, { once: true });
}

function dodge(e) {
  if (e) e.preventDefault();
  const msgs = CONFIG.noMessages;
  document.getElementById('noMsg').textContent = msgs[Math.min(noCount, msgs.length - 1)];
  noCount++;

  const yesBtn = document.getElementById('yesBtn');
  yesBtn.style.fontSize = (17 + noCount * 5) + 'px';
  yesBtn.style.padding = `${14 + noCount * 3}px ${28 + noCount * 6}px`;

  if (noCount >= msgs.length) {
    noBtn.style.display = 'none';
    return;
  }
  const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
  noBtn.style.left = (16 + Math.random() * (window.innerWidth - w - 32)) + 'px';
  noBtn.style.top = (16 + Math.random() * (window.innerHeight - h - 32)) + 'px';
}
noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('touchstart', dodge, { passive: false });
noBtn.addEventListener('click', dodge);

function notify(subject, message) {
  return fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ access_key: CONFIG.web3formsKey, subject, from_name: 'Naa Dream page', message }),
  }).then(r => r.json()).then(r => r.success).catch(() => false);
}

function yes() {
  noBtn.style.display = 'none';
  burst();
  notify('Dhenuka said YES! 🎉',
    `She said YES to the date! 🥳
She tried to tap No ${noCount} time(s) 😂
Now she's picking the prize and the day…`);
  show(`
    <div class="emoji">🥳</div>
    <h1>YAYYY!!</h1>
    <p>Naaku telusu nuvvu Yes antav ani 😌💚</p>
    <p class="small">Ippudu mana date plan cheddam…</p>
    <button class="btn" onclick="challenge()">Plan cheddam 📅</button>
  `);
}

function challenge() {
  show(`
    <div class="emoji">📸</div>
    <h1>Flower Photo Challenge 🌸</h1>
    <p>UGA campus lo walk chestu, flowers ni photos teeddam.<br><br>Evari pic best aithe… odipoyina vallu treat ivvali 😏</p>
    <p class="small">Pro photographer tho competition… nenu odipotha anukunta 😅 kani try chestha!</p>
    <button class="btn" onclick="rules()">Rules enti? 👀</button>
  `);
}

function rules() {
  show(`
    <div class="emoji">📜</div>
    <h1>Rules</h1>
    <ul class="rules">${CONFIG.rules.map(r => `<li>${r}</li>`).join('')}</ul>
    <button class="btn" onclick="plan()">Deal! 🤝</button>
  `);
}

function plan() {
  show(`
    <div class="emoji">🏆</div>
    <h1>Mana date</h1>
    <div class="label">Winner ki prize enti?</div>
    <div class="options" id="prizes">${CONFIG.prizes.map(p => `<button class="opt" data-v="${p}">${p}</button>`).join('')}</div>
    <div class="label">Eppudu? (☀️ 11 AM)</div>
    <div class="options" id="days">${CONFIG.days.map(d => `<button class="opt" data-v="${d}">${d}</button>`).join('')}</div>
    <button class="btn" id="done" onclick="done()" style="opacity:.4;pointer-events:none">Done</button>
  `);
  pick('prizes', 'prize');
  pick('days', 'day');
}

function pick(id, key) {
  document.querySelectorAll(`#${id} .opt`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} .opt`).forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    choice[key] = b.dataset.v;
    if (choice.prize && choice.day) {
      const d = document.getElementById('done');
      d.style.opacity = 1; d.style.pointerEvents = 'auto';
    }
  });
}

function done() {
  burst();
  show(`
    <div class="emoji">💚</div>
    <h1>It's a date!</h1>
    <div class="summary">📸 Flower Photo Challenge @ UGA<br>🏆 Prize: ${choice.prize}<br>📅 ${choice.day} · ☀️ 11 AM</div>
    <p style="margin-top:18px">Aa roju naa dream lo secret kuda cheptha 😏🌙</p>
    <a class="btn cal" href="${calendarLink()}" target="_blank" rel="noopener">📅 Add to Google Calendar</a>
    <p class="small"><span id="sent"></span>See you on ${CONFIG.dayInfo[choice.day][1]}! 😊</p>
  `);
  notify(`It's a date! ${choice.prize} · ${choice.day} 📸`,
    `Dhenuka finished planning the date! 🎉

Plan: Flower Photo Challenge @ UGA
Prize: ${choice.prize}
Date: ${choice.day} · 11 AM`)
    .then(ok => { if (ok) document.getElementById('sent').textContent = 'Nee answer naaku reach ayyindi 😌 '; });
}

function calendarLink() {
  const date = CONFIG.dayInfo[choice.day][0];
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: '📸 Flower Photo Challenge 🌸',
    dates: `${date}T110000/${date}T140000`,
    ctz: 'America/New_York',
    location: 'University of Georgia, Athens, GA',
    details: `Flower photo challenge at UGA campus 🌸
Rules: phone camera only, 3 best pics each, no editing!
Loser treats the winner: ${choice.prize} 🏆`,
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

/* ---------- stars background ---------- */
const sc = document.getElementById('stars'), sx = sc.getContext('2d');
let stars = [];
function sizeStars() {
  sc.width = innerWidth; sc.height = innerHeight;
  stars = Array.from({ length: Math.round(innerWidth * innerHeight / 5000) }, () => ({
    x: Math.random() * sc.width, y: Math.random() * sc.height,
    r: Math.random() * 1.4 + .3, p: Math.random() * Math.PI * 2,
  }));
}
function drawStars(t) {
  sx.clearRect(0, 0, sc.width, sc.height);
  for (const s of stars) {
    sx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t / 1200 + s.p));
    sx.fillStyle = '#eafff1';
    sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 7); sx.fill();
  }
  requestAnimationFrame(drawStars);
}
addEventListener('resize', sizeStars);
sizeStars(); requestAnimationFrame(drawStars);

/* ---------- confetti ---------- */
const cc = document.getElementById('confetti'), cx = cc.getContext('2d');
let bits = [];
function burst() {
  cc.width = innerWidth; cc.height = innerHeight;
  const colors = ['#1fae63', '#3ddc84', '#c6f6d9', '#ffe066', '#ffffff', '#8be9b0'];
  const start = bits.length === 0;
  for (let i = 0; i < 160; i++) bits.push({
    x: innerWidth / 2, y: innerHeight / 2,
    vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4,
    s: Math.random() * 8 + 4, c: colors[i % colors.length],
    r: Math.random() * 6, vr: (Math.random() - .5) * .3,
    heart: Math.random() < .35, flower: Math.random() < .5,
  });
  if (start) requestAnimationFrame(drawConfetti);
}
function drawConfetti() {
  cx.clearRect(0, 0, cc.width, cc.height);
  bits.forEach(b => {
    b.vy += .3; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.vx *= .99;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r);
    if (b.heart) { cx.font = `${b.s * 2}px serif`; cx.fillText(b.flower ? '🌸' : '💚', 0, 0); }
    else { cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); }
    cx.restore();
  });
  bits = bits.filter(b => b.y < cc.height + 40);
  if (bits.length) requestAnimationFrame(drawConfetti);
  else cx.clearRect(0, 0, cc.width, cc.height);
}

intro();
</script>
